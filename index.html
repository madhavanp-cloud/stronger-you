<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stronger You</title>
<meta name="theme-color" content="#3d6b66">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#1c1b19; --muted:#6c6760;
  --line:#e2ddd2; --accent:#3d6b66; --accent-ink:#ffffff;
  --warn:#a8542a; --ok:#3d6b66; --soft:#efece4;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a; --panel:#1d2124; --ink:#eceae6; --muted:#9aa09f;
    --line:#2e3438; --accent:#6fb3aa; --accent-ink:#10201e;
    --warn:#e0956a; --ok:#6fb3aa; --soft:#232a2d;
  }
}
:root[data-theme="dark"]{
  --bg:#15181a; --panel:#1d2124; --ink:#eceae6; --muted:#9aa09f;
  --line:#2e3438; --accent:#6fb3aa; --accent-ink:#10201e;
  --warn:#e0956a; --ok:#6fb3aa; --soft:#232a2d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 72px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.meta{font-size:12px;color:var(--muted)}
.meta button{font-size:12px;padding:4px 8px;min-height:0}
.today{font-size:14px;color:var(--muted);margin:2px 0 14px}

nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:9px 15px;font-size:15px;font-weight:600;cursor:pointer;
}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:17px;margin:0 0 2px}
.sub{font-size:14px;color:var(--muted);margin:0 0 10px}
.hint{font-size:13px;color:var(--warn);margin:6px 0 0}

button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button:active{transform:translateY(1px)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}
input[type="number"]{-moz-appearance:textfield}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}

ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
ul.plain li:last-child{border-bottom:0}

.ex{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.setrow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.setrow.one{grid-template-columns:52px 1fr}
.setrow .lab{font-size:13px;color:var(--muted)}
.unit{font-size:12px;color:var(--muted);margin-top:3px}
.ramp{font-size:14px;color:var(--muted);background:var(--soft);border-radius:9px;padding:8px 10px;margin-top:8px}
.rest{font-size:13px;color:var(--muted);margin-top:6px}

.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rowbtns button{flex:1 1 auto}

.prop{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.prop .line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;font-size:15px;border-bottom:1px solid var(--line)}
.prop .line:last-of-type{border-bottom:0}
.prop .to{font-weight:600;color:var(--ok)}
.prop .hold{color:var(--muted);font-weight:400}

.hist{border-bottom:1px solid var(--line);padding:12px 0}
.hist:last-child{border-bottom:0}
.hist .d{font-weight:600}
.hist .t{font-size:13px;color:var(--muted)}
.hist .n{font-size:14px;margin-top:6px;color:var(--ink);background:var(--soft);padding:8px 10px;border-radius:8px}
.hist ul{margin:8px 0 0;padding:0;list-style:none}
.hist ul li{font-size:14px;padding:3px 0;color:var(--muted)}
.hist ul li b{color:var(--ink);font-weight:600}
.gap{background:var(--soft);border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}

svg.chart{width:100%;height:170px;display:block}
.chartwrap{margin-top:10px}
.legend{font-size:12px;color:var(--muted);margin-top:4px}

.flex{display:flex;gap:10px;flex-wrap:wrap}
.flex > *{flex:1 1 140px}
.saved{font-size:14px;color:var(--ok);margin-top:8px}
.planbox{border-color:var(--accent);border-width:2px}
.danger{color:var(--warn)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.small{font-size:13px;color:var(--muted)}
@media (max-width:400px){
  .setrow{grid-template-columns:46px 1fr 1fr;gap:6px}
}
</style>
</head>
<body>

  <header>

</div>

function applyPlan(){
  // Merge any new stack notches first, so a target that sits on one is valid.
  (PLAN.stack||[]).forEach(function(n){
    if(S.programme.stack.indexOf(n) < 0) S.programme.stack.push(n);
  });
  S.programme.stack.sort(function(a,b){ return a-b; });

  var changed = 0;
  Object.keys(PLAN.days).forEach(function(dayKey){
    var day = S.programme.days[dayKey];
    if(!day) return;
    var all = day.exercises.concat(day.finisher||[]);
    Object.keys(PLAN.days[dayKey]).forEach(function(id){
      var want = PLAN.days[dayKey][id];
      var e = all.filter(function(x){ return x.id === id; })[0];
      if(!e) return;
      Object.keys(want).forEach(function(k){
        if(e[k] !== want[k]){ e[k] = want[k]; changed++; }
      });
    });
  });
  S.appliedPlan = PLAN.id;
  save(S);
  return changed;
}

function planBanner(){
  if(S.appliedPlan === PLAN.id) return null;
  return el("div",{class:"card planbox"},[
    el("h2",{},["New targets — " + PLAN.label]),
    el("p",{class:"sub"},[PLAN.note]),
    el("div",{class:"rowbtns"},[
      el("button",{class:"primary", onclick:function(){
        var n = applyPlan();
        render(); window.scrollTo(0,0);
        alert(n ? ("Applied — " + n + " target" + (n===1?"":"s") + " updated.") : "Nothing to change; you were already on these numbers.");
      }},["Apply"]),
      el("button",{class:"ghost", onclick:function(){
        S.appliedPlan = PLAN.id; save(S); render();
      }},["Not now"])
    ])
  ]);
}

function defaultState(){
  return { programme: defaultProgramme(),
           history: JSON.parse(JSON.stringify(SEED.history)),
           gaps: JSON.parse(JSON.stringify(SEED.gaps)),
           build: BUILD };
}
// Add any seeded session the store is missing, without touching what is already there.
function mergeSeed(){
  var have = {};
  S.history.forEach(function(h){ have[h.date + '|' + h.day] = true; });
  var added = 0;
  SEED.history.forEach(function(h){
    if(have[h.date + '|' + h.day]) return;
    S.history.push(JSON.parse(JSON.stringify(h))); added++;
  });
  var gw = {}; S.gaps.forEach(function(g){ gw[g.week] = true; });
  SEED.gaps.forEach(function(g){ if(!gw[g.week]) S.gaps.push(JSON.parse(JSON.stringify(g))); });
  S.history.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  return added;
}

var S = load() || defaultState();
if(!S.programme) S.programme = defaultProgramme();
if(!S.history) S.history = [];
if(!S.gaps) S.gaps = [];
if(!S.programme.stack) S.programme.stack = STACK.slice();
// Older stored programmes have no per-exercise step. Fill it from the defaults
// by id, without touching any weight the user has set.
(function backfillSteps(){
  var def = defaultProgramme(), want = {};
  Object.keys(def.days).forEach(function(k){
    def.days[k].exercises.concat(def.days[k].finisher||[]).forEach(function(e){ want[e.id] = e.step||0; });
  });
  Object.keys(S.programme.days).forEach(function(k){
    var d = S.programme.days[k];
    d.exercises.concat(d.finisher||[]).forEach(function(e){
      if(e.step === undefined || e.step === null) e.step = want[e.id] || 0;
    });
  });
})();

    else if(attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(c){
    if(c === null || c === undefined) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
function iso(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
function prettyDate(s){
  var d = new Date(s+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
function round25(n){ return Math.round(n/2.5)*2.5; }
function fmt(n){
  if(n === null || n === undefined || n === "") return "—";
  return (Math.round(n*100)/100).toString();
}
function unitLabel(u){
  return u === "kg/side" ? "kg/side" : u === "kg/hand" ? "kg/hand"
       : u === "bw" ? "reps" : u === "sec" ? "sec" : u === "min" ? "min" : "kg";
}

/* ---------- ramping sets ---------- */
function rampFor(e){
  var t = Number(e.target)||0;
  if(e.ramp === "barbell"){
    var out = ["20 kg x 5 (empty bar)"];
    if(t > 30) out.push(round25(t*0.7) + " kg x 5");
    if(t > 24) out.push(round25(t*0.85) + " kg x 3");
    return out;
  }
  if(e.ramp === "legpress"){
    return [round25(t*0.4) + " kg/side x 8", round25(t*0.65) + " kg/side x 5"];
  }
  return null;
}

/* ---------- progression ---------- */
function nextStack(w, stack){
  for(var i=0;i<stack.length;i++){ if(stack[i] > w + 0.01) return stack[i]; }
  return w;
}
// Was the exercise clean in this entry? Every set at or above target, top of rep range.
function entryClean(entry, e){
  if(!entry || !entry.sets || !entry.sets.length) return false;
  var need = Number(e.repTop)||0;
  var tgt = Number(e.target)||0;
  for(var i=0;i<entry.sets.length;i++){
    var s = entry.sets[i];
    if(e.kind === "reps"){
      if(i === 0 && (Number(s.reps)||0) < need) return false;
      if((Number(s.reps)||0) <= 0) return false;
    } else if(e.kind === "time" || e.kind === "time2"){
      if((Number(s.secs)||0) < need) return false;
    } else if(e.kind === "timeweight"){
      if((Number(s.secs)||0) < need) return false;
      if((Number(s.weight)||0) < tgt - 0.01) return false;
    } else {
      if((Number(s.weight)||0) < tgt - 0.01) return false;
      if((Number(s.reps)||0) < need) return false;
    }
  }
  if(entry.sets.length < (Number(e.sets)||1)) return false;
  return true;
}
// consecutive clean sessions at the current target, most recent first
function cleanStreak(dayKey, e){
  var n = 0;
  var h = S.history.filter(function(x){ return x.day === dayKey; })
                   .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  for(var i=0;i<h.length;i++){
    var entry = h[i].entries.filter(function(en){ return en.id === e.id; })[0];
    if(!entry) break;
    var w = Math.max.apply(null, entry.sets.map(function(s){ return Number(s.weight)||0; }).concat([0]));
    if(Math.abs(w - (Number(e.target)||0)) > 0.01) break;
    if(!entryClean(entry, e)) break;
    n++;
  }
  return n;
}
function propose(dayKey, e, entry){
  var t = Number(e.target)||0;
  var clean = entryClean(entry, e);
  if(e.prog === "none") return {to:t, why:"no automatic progression", hold:true};
  if(!clean) return {to:t, why:"hold — the session wasn't clean at this weight", hold:true};
  // (why strings below read on their own; the panel does not add a prefix)

  switch(e.prog){
    case "barbell":
      // Over 60 kg every barbell lift holds for a second clean session first.
      if(t >= 60){
        var n = cleanStreak(dayKey, e);
        if(n >= 2) return {to:t+(e.step||2.5), why:"two clean sessions at 60 kg or over"};
        return {to:t, why:"hold — one clean session at 60 kg or over, a second is needed", hold:true};
      }
      // Below 60 kg each lift uses its own step, set in Settings. The old
      // blanket "+5 under 50" suited squats and deadlifts but overshot rows.
      if(e.step) return {to:t+e.step, why:"its own step of " + fmt(e.step) + " kg"};
      if(t < 50) return {to:t+5, why:"under 50 kg, add 5 kg"};
      return {to:t+2.5, why:"50 to 60 kg, add 2.5 kg"};
    case "legpress":
      return {to:t+(e.step||2.5), why:fmt(e.step||2.5) + " kg a side"};
    case "dumbbell":
      return {to:t+(e.step||2.5), why:"next dumbbell up"};
    case "stack":
      var nx = nextStack(t, S.programme.stack);
      if(nx === t) return {to:t, why:"hold — top of the stack", hold:true};
      return {to:nx, why:"next notch on the stack"};
    case "pushups":
      return {to:0, reps:bumpReps(e.reps), why:"one extra rep a set"};
    case "hold": {
      var secs = Number(e.repTop)||0;
      if(secs >= 45) return {to:t+4, secs:30, why:"45 seconds reached, add 4 kg a hand and restart the seconds"};
      return {to:t, secs:secs+5, why:"add 5 seconds before adding weight", holdWeight:true};
    }
    case "time3": {
      var s3 = Number(e.repTop)||0;
      return {to:0, secs:s3+3, why:"add 3 seconds"};
    }
    case "time5": {
      var s5 = Number(e.repTop)||0;
      return {to:0, secs:s5+5, why:"add 5 seconds"};
    }
  }
  return {to:t, why:"hold", hold:true};
}
function bumpReps(repsStr){
  // "13, 11, 9" -> "14, 12, 10"
  var parts = String(repsStr).split(",").map(function(p){ return p.trim(); });
  if(parts.length > 1 && parts.every(function(p){ return /^\d+$/.test(p); })){
    return parts.map(function(p){ return Number(p)+1; }).join(", ");
  }
  if(/^\d+$/.test(String(repsStr).trim())) return String(Number(repsStr)+1);
  return repsStr;
}

/* ---- session ---- */

  }

}

    ]),

function exerciseBlock(dayKey, e, num, d){
  var key = e.id;
  if(!d.vals[key]) d.vals[key] = [];
  var box = el("div",{class:"ex"});

  var titleTxt = (num ? num + ". " : "") + e.name;
  box.appendChild(el("h3",{},[titleTxt]));

  var targetTxt;
  if(e.kind === "reps") targetTxt = e.sets + " sets — " + e.reps + " (bodyweight)";
  else if(e.kind === "time" || e.kind === "time2") targetTxt = e.sets + " sets — " + e.reps;
  else if(e.kind === "timeweight") targetTxt = e.sets + " sets — " + fmt(e.target) + " " + unitLabel(e.unit) + ", " + e.repTop + " sec";
  else targetTxt = e.sets + " x " + e.reps + " — target " + fmt(e.target) + " " + unitLabel(e.unit);
  box.appendChild(el("p",{class:"sub"},[targetTxt]));

  if(e.note) box.appendChild(el("p",{class:"small"},[e.note]));

  var r = rampFor(e);
  if(r) box.appendChild(el("div",{class:"ramp"},["Ramping sets: " + r.join(" · ") + ". Sixty seconds between these, three minutes before the first work set."]));

  for(var i=0;i<e.sets;i++){
    box.appendChild(setRow(e, i, d.vals[key]));
  }
  if(num === 1 || num === 2) box.appendChild(el("p",{class:"rest"},["Three minutes rest."]));
  else if(num) box.appendChild(el("p",{class:"rest"},["Ninety seconds rest."]));
  return box;
}

function setRow(e, i, store){
  if(!store[i]) store[i] = {};
  var v = store[i];
  var lab = el("span",{class:"lab"},["Set " + (i+1)]);

  function numInput(field, ph, dflt){
    return el("input",{
      type:"number", inputmode:"decimal", step:"any", placeholder:ph,
      value: (v[field] !== undefined && v[field] !== "") ? v[field] : "",
      onchange:function(ev){ v[field] = ev.target.value; }
    });
  }

  if(e.kind === "reps"){
    return el("div",{class:"setrow one"},[lab, numInput("reps","reps")]);
  }
  if(e.kind === "time"){
    return el("div",{class:"setrow one"},[lab, numInput("secs", unitLabel(e.unit))]);
  }
  if(e.kind === "time2"){
    return el("div",{class:"setrow"},[lab, numInput("secs","left sec"), numInput("secs2","right sec")]);
  }
  if(e.kind === "timeweight"){
    return el("div",{class:"setrow"},[lab, numInput("weight", unitLabel(e.unit)), numInput("secs","sec")]);
  }
  return el("div",{class:"setrow"},[lab, numInput("weight", unitLabel(e.unit)), numInput("reps","reps")]);
}

function doSave(dayKey, d, msg, propBox){
  var day = S.programme.days[dayKey];
  var all = day.exercises.concat(day.finisher || []);
  var entries = [];
  all.forEach(function(e){
    var rows = (d.vals[e.id]||[]).filter(function(s){
      return s && (s.weight || s.reps || s.secs || s.secs2);
    });
    if(!rows.length) return;
    entries.push({
      id: e.id,
      name: e.name,              // frozen at log time — never rewritten
      unit: e.unit,
      kind: e.kind,
      targetAtTime: e.target,
      repTopAtTime: e.repTop,
      setsAtTime: e.sets,
      sets: rows.map(function(s){
        return {
          weight: s.weight === "" || s.weight === undefined ? null : Number(s.weight),
          reps:   s.reps   === "" || s.reps   === undefined ? null : Number(s.reps),
          secs:   s.secs   === "" || s.secs   === undefined ? null : Number(s.secs),
          secs2:  s.secs2  === "" || s.secs2  === undefined ? null : Number(s.secs2)
        };
      })
    });
  });

  if(!entries.length){
    msg.textContent = "Nothing logged yet — fill in at least one set.";
    msg.className = "saved danger";
    return;
  }

  var rec = { date: d.date, day: dayKey, dayLabel: day.label, note: d.note || "", entries: entries, build: BUILD };
  // replace an existing record for the same date+day
  S.history = S.history.filter(function(h){ return !(h.date === rec.date && h.day === rec.day); });
  S.history.push(rec);
  S.history.sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  var ok = save(S);
  msg.className = "saved";
  msg.textContent = ok
    ? "Saved — " + prettyDate(rec.date) + "."
    : "Logged for this visit, but the browser refused to store it. Export before you close the tab.";

  propBox.innerHTML = "";
  propBox.appendChild(proposalPanel(dayKey, rec));
}

function proposalPanel(dayKey, rec){
  var day = S.programme.days[dayKey];
  var all = day.exercises.concat(day.finisher || []);
  var props = [];
  all.forEach(function(e){
    var entry = rec.entries.filter(function(en){ return en.id === e.id; })[0];
    if(!entry) return;
    var p = propose(dayKey, e, entry);
    props.push({e:e, p:p});
  });
  if(!props.length) return el("div",{});

  var box = el("div",{class:"prop"},[ el("h2",{},["Next time"]) ]);
  props.forEach(function(x){
    var e = x.e, p = x.p, desc;
    if(p.hold && p.to === Number(e.target)) desc = el("span",{class:"hold"},[p.why]);
    else if(p.reps) desc = el("span",{class:"to"},[p.reps + " — " + p.why]);
    else if(p.secs !== undefined && p.holdWeight) desc = el("span",{class:"to"},[p.secs + " sec — " + p.why]);
    else if(p.secs !== undefined && Number(p.to) !== Number(e.target)) desc = el("span",{class:"to"},[fmt(p.to) + " " + unitLabel(e.unit) + ", " + p.secs + " sec — " + p.why]);
    else if(p.secs !== undefined) desc = el("span",{class:"to"},[p.secs + " sec — " + p.why]);
    else desc = el("span",{class:"to"},[fmt(p.to) + " " + unitLabel(e.unit) + " — " + p.why]);

    box.appendChild(el("div",{class:"line"},[ el("span",{},[e.name]), desc ]));
  });

  box.appendChild(el("div",{class:"rowbtns"},[
    el("button",{class:"primary", onclick:function(){
      props.forEach(function(x){ applyProposal(x.e, x.p); });
      save(S);
      render();
      window.scrollTo(0,0);
    }},["Accept all"]),
    el("button",{class:"ghost", onclick:function(){ box.remove(); }},["Leave as is"])
  ]));
  box.appendChild(el("p",{class:"small"},["Anything you disagree with, change it by hand under Settings."]));
  return box;
}

function applyProposal(e, p){
  if(p.hold && p.to === Number(e.target) && p.secs === undefined && !p.reps) return;
  if(p.reps){ e.reps = p.reps; e.repTop = Number(String(p.reps).split(",")[0]) || e.repTop; return; }
  if(p.secs !== undefined){
    e.repTop = p.secs;
    if(e.kind === "timeweight"){ e.target = p.to; e.reps = p.secs + " sec"; }
    else { e.reps = p.secs + " sec" + (e.kind === "time2" ? " each side" : ""); }
    if(p.holdWeight) return;
    return;
  }
  e.target = p.to;
}

function setsText(en){
  return en.sets.map(function(s){
    if(en.kind === "reps") return (s.reps === null ? "—" : s.reps);
    if(en.kind === "time") return (s.secs === null ? "—" : s.secs + "s");
    if(en.kind === "time2") return "L" + (s.secs===null?"—":s.secs) + "/R" + (s.secs2===null?"—":s.secs2);
    if(en.kind === "timeweight") return fmt(s.weight) + unitShort(en.unit) + " " + (s.secs===null?"—":s.secs+"s");
    return fmt(s.weight) + unitShort(en.unit) + " x " + (s.reps === null ? "—" : s.reps);
  }).join(", ");
}
function unitShort(u){
  return u === "kg/side" ? "kg/side" : u === "kg/hand" ? "kg/hand" : u === "bw" ? "" : "kg";
}

function chartFor(key){
  var parts = key.split("|"), kDay = parts[0], kId = parts[1], kName = parts.slice(2).join("|");
  var pts = [];
  S.history.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(h){
    if(h.day !== kDay) return;
    h.entries.forEach(function(en){
      if(en.id !== kId || en.name !== kName) return;
      var w = Math.max.apply(null, en.sets.map(function(s){ return Number(s.weight)||0; }).concat([0]));
      if(w > 0) pts.push({d:h.date, w:w});
    });
  });
  var W = 640, H = 170, pad = 28;
  var svg = el("div",{});
  if(pts.length < 2){
    svg.appendChild(el("p",{class:"small"},["Not enough sessions yet to draw a line."]));
    return svg;
  }
  var ws = pts.map(function(p){ return p.w; });
  var min = Math.min.apply(null, ws), max = Math.max.apply(null, ws);
  var lo = min, hi = max;                      // true range, for the caption
  if(hi === lo){ lo = min - 1; hi = max + 1; } // flat line sits in the middle
  var sx = function(i){ return pad + (i*(W-2*pad))/(pts.length-1); };
  var sy = function(w){ return H - pad - ((w-lo)*(H-2*pad))/(hi-lo); };

  var dAttr = pts.map(function(p,i){ return (i?"L":"M") + sx(i).toFixed(1) + " " + sy(p.w).toFixed(1); }).join(" ");
  var circles = pts.map(function(p,i){
    return '<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(p.w).toFixed(1)+'" r="3.5" fill="currentColor"></circle>';
  }).join("");
  var html = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="color:var(--accent)">'
    + '<path d="'+dAttr+'" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"></path>'
    + circles
    + '</svg>';
  svg.innerHTML = html;
  svg.appendChild(el("p",{class:"legend"},[
    (min === max ? fmt(min) + " kg throughout" : fmt(min) + " kg to " + fmt(max) + " kg") + " · " + pts.length + " sessions · "
    + prettyDate(pts[0].d) + " to " + prettyDate(pts[pts.length-1].d)
  ]));
  return svg;
}

/* ---- export / import ---- */
function download(name, text, type){
  var blob = new Blob([text], {type:type});
  var url = URL.createObjectURL(blob);
  var a = el("a",{href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function exportJSON(){
  download("stronger-you-" + iso(new Date()) + ".json", JSON.stringify(S, null, 2), "application/json");
}
function exportCSV(){
  var rows = [["date","session","exercise","unit","set","weight","reps","seconds","seconds_right","note"]];
  S.history.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(h){
    h.entries.forEach(function(en){
      en.sets.forEach(function(s, i){
        rows.push([h.date, h.dayLabel, en.name, en.unit, i+1,
          s.weight===null?"":s.weight, s.reps===null?"":s.reps,
          s.secs===null?"":s.secs, s.secs2===null?"":s.secs2,
          i===0 ? (h.note||"") : ""]);
      });
    });
  });
  var csv = rows.map(function(r){
    return r.map(function(c){
      var v = String(c===null||c===undefined?"":c);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(",");
  }).join("\n");
  download("stronger-you-" + iso(new Date()) + ".csv", csv, "text/csv");
}
function importJSON(){
  var inp = el("input",{type:"file", accept:"application/json,.json"});
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var data = JSON.parse(fr.result);
        if(!data || !data.history) throw new Error("not a Stronger You export");
        if(!confirm("Replace everything currently stored with this file?")) return;
        S = data;
        if(!S.programme) S.programme = defaultProgramme();
        if(!S.gaps) S.gaps = [];
        save(S); render();
      }catch(err){ alert("Couldn't read that file: " + err.message); }
    };
    fr.readAsText(f);
  });
  inp.click();
}

/* ---- settings ---- */
function settingsView(){
  var frag = document.createDocumentFragment();

  ["tuesday","thursday","saturday","cardio"].forEach(function(k){
    var day = S.programme.days[k];
    var card = el("div",{class:"card"},[ el("h2",{},[day.label + " targets"]) ]);
    day.exercises.concat(k === "cardio" ? [] : day.finisher).forEach(function(e){
      var row = el("div",{style:"padding:10px 0;border-bottom:1px solid var(--line)"});
      row.appendChild(el("div",{style:"font-weight:600;margin-bottom:6px"},[e.name]));
      var flex = el("div",{class:"flex"});
      if(e.kind !== "reps" && e.unit !== "bw" && e.unit !== "sec" && e.unit !== "min"){
        var wIn = el("div",{},[
          el("label",{},["Weight (" + unitLabel(e.unit) + ")"]),
          el("input",{type:"number", step:"any", value:e.target, onchange:function(ev){
            e.target = Number(ev.target.value)||0; save(S);
          }})
        ]);
        flex.appendChild(wIn);
      }
      if(e.prog === "barbell" || e.prog === "legpress" || e.prog === "dumbbell"){
        flex.appendChild(el("div",{},[
          el("label",{},["Step up by (kg)"]),
          el("input",{type:"number", step:"any", value:e.step||"", placeholder:"auto", onchange:function(ev){
            e.step = Number(ev.target.value)||0; save(S);
          }})
        ]));
      }
      flex.appendChild(el("div",{},[
        el("label",{},["Sets"]),
        el("input",{type:"number", step:"1", min:"1", value:e.sets, onchange:function(ev){
          e.sets = Math.max(1, Number(ev.target.value)||1); save(S);
        }})
      ]));
      flex.appendChild(el("div",{},[
        el("label",{},["Reps / time"]),
        el("input",{type:"text", value:e.reps, onchange:function(ev){
          e.reps = ev.target.value;
          var first = Number(String(e.reps).replace(/[^0-9.].*$/,""));
          if(first) e.repTop = first;
          save(S);
        }})
      ]));
      row.appendChild(flex);
      card.appendChild(row);
    });
    frag.appendChild(card);
  });

  // stack notches
  var stackIn = el("input",{type:"text", value:S.programme.stack.join(", ")});
  frag.appendChild(el("div",{class:"card"},[
    el("h2",{},["Weight-stack notches"]),
    el("p",{class:"sub"},["The weights the Precor stacks actually offer, in kg. The app steps to the next one on this list rather than inventing a number the machine can't do."]),
    stackIn,
    el("div",{class:"rowbtns"},[
      el("button",{onclick:function(){
        var vals = stackIn.value.split(",").map(function(s){ return Number(s.trim()); })
                    .filter(function(n){ return !isNaN(n) && n > 0; })
                    .sort(function(a,b){ return a-b; });
        if(!vals.length) return alert("Give at least one number.");
        S.programme.stack = vals; save(S); render();
      }},["Save notches"])
    ])
  ]));

  // reset
  frag.appendChild(el("div",{class:"card"},[
    el("h2",{},["Danger"]),
    el("p",{class:"sub"},["Export first. This cannot be undone."]),
    el("div",{class:"rowbtns"},[
      el("button",{class:"ghost", onclick:function(){
        var n = mergeSeed(); save(S); render();
        alert(n ? ("Added " + n + " session" + (n===1?"":"s") + " from the Excel tracker.") : "Nothing missing — all seeded sessions are already here.");
      }},["Re-add the Excel history"]),
      el("button",{class:"ghost", onclick:function(){
        if(!confirm("Reset the programme targets to the defaults? Your logged history is kept.")) return;
        S.programme = defaultProgramme(); save(S); render();
      }},["Reset targets to defaults"]),
      el("button",{class:"ghost danger", onclick:function(){
        if(!confirm("Delete ALL logged history as well as the programme? Export first.")) return;
        if(!confirm("Really? Everything goes.")) return;
        S = defaultState(); save(S); render();
      }},["Erase everything"])
    ])
  ]));

  return frag;
}

/* ---------- chrome ---------- */
function stamp(){
  var t;
  try{ t = new Date(BUILD_TIME).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ t = BUILD_TIME; }
  $("#buildmeta").textContent = "v" + BUILD + " · updated " + t;
  $("#todayline").textContent = new Date().toLocaleDateString(undefined,
    {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
$("#refresh").addEventListener("click", function(){
  if(window.caches && caches.keys){
    caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
      .then(function(){ location.replace(location.pathname + "?v=" + Date.now()); });
  } else {
    location.replace(location.pathname + "?v=" + Date.now());
  }
});

stamp();
renderTabs();
render();
</script>
