<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3d6b66">
<link rel="manifest" href="manifest.json">
<title>Stronger You</title>
<style>
  :root {
    --paper: #f7f6f3;
    --ink: #1c1c1a;
    --ink-dim: #5a5a54;
    --line: #d8d5cd;
    --card: #ffffff;
    --accent: #3d6b66;
    --accent-ink: #ffffff;
    --focus: #2f5551;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17181a;
      --ink: #ece9e2;
      --ink-dim: #a3a099;
      --line: #38393a;
      --card: #202224;
      --accent: #5e9a92;
      --accent-ink: #10201d;
      --focus: #7fb6ad;
    }
  }
  :root[data-theme="dark"] {
    --paper: #17181a;
    --ink: #ece9e2;
    --ink-dim: #a3a099;
    --line: #38393a;
    --card: #202224;
    --accent: #5e9a92;
    --accent-ink: #10201d;
    --focus: #7fb6ad;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.4;
    padding: 16px 16px 72px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  header { margin-bottom: 18px; }
  h1 {
    font-size: 23px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .date-line { color: var(--ink-dim); font-size: 15px; }
  .last-saved-line {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .saved {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }

  .switcher {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .switcher button {
    flex: 1 1 0;
    padding: 12px 6px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
  }
  .switcher button.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .switcher button:focus-visible,
  input:focus-visible,
  .export-buttons button:focus-visible,
  .danger-btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .chooser-hint {
    font-size: 15px;
    color: var(--ink-dim);
    margin-top: 14px;
  }

  .exercise {
    border-top: 1px solid var(--line);
    padding: 18px 0 22px;
  }
  .exercise:first-of-type { border-top: none; padding-top: 8px; }

  .ex-name {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 3px;
    letter-spacing: -0.005em;
  }
  .ex-target { font-size: 15px; color: var(--ink-dim); margin: 0 0 4px; }
  .ex-note { font-size: 14px; color: var(--ink-dim); margin: 0 0 12px; }
  .ex-target:last-of-type { margin-bottom: 12px; }

  .col-headers {
    display: grid;
    grid-template-columns: 52px 32px 1fr 40px 1fr;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
  }
  .col-headers.type-none { grid-template-columns: 52px 32px 1fr; }

  .set-row {
    display: grid;
    grid-template-columns: 52px 32px 1fr 40px 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .set-row.type-none { grid-template-columns: 52px 32px 1fr; }

  .set-row .set-label {
    font-size: 15px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .set-row input[type="checkbox"] {
    width: 28px;
    height: 28px;
    accent-color: var(--accent);
  }
  .set-row input[type="number"] {
    width: 100%;
    min-width: 0;
    height: 48px;
    font-size: 18px;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--card);
    padding: 4px 10px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
  }
  .set-row input[type="number"]::placeholder { color: var(--ink-dim); opacity: 0.7; }
  .set-row .unit-label {
    font-size: 12px;
    color: var(--ink-dim);
  }

  .finisher-section {
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 20px;
  }
  .finisher-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .history-section {
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 20px;
  }
  .history-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  .history-empty {
    font-size: 15px;
    color: var(--ink-dim);
  }
  .history-list {
    max-height: 360px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 2px;
  }
  .history-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .history-date {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .history-ex {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 3px;
    line-height: 1.4;
  }
  .history-ex:last-child { margin-bottom: 0; }
  .history-ex b { color: var(--ink); font-weight: 600; }

  .export-section {
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 20px;
  }
  .export-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
  .export-buttons button {
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    flex: 0 0 auto;
  }
  .export-buttons button#export-btn { flex: 1 1 auto; }
  .export-buttons button#copy-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  #export-text {
    width: 100%;
    min-height: 160px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
  }
  #export-text::placeholder { color: var(--ink-dim); }
  .copy-status {
    font-size: 13px;
    color: var(--accent);
    margin-top: 6px;
    min-height: 18px;
  }

  .danger-section {
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 20px;
  }
  .danger-btn {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #b3261e;
    background: var(--card);
    border: 1.5px solid #b3261e55;
    border-radius: 10px;
  }
  .danger-status {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 8px;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "strongerYou.v1";

  var SESSIONS = {
    Tuesday: {
      label: "Tuesday — squat & horizontal pull",
      exercises: [
        { name: "Front squat", sets: 4, repsTarget: "5", fieldType: "weight", weight: 30 },
        { name: "Seated cable row", sets: 4, repsTarget: "6", fieldType: "weight", weight: 41.5 },
        { name: "Leg curl", sets: 3, repsTarget: "8-10", fieldType: "weight", weight: 36.5 },
        { name: "Lat pulldown", sets: 3, repsTarget: "8-10", fieldType: "weight", weight: 32 },
        { name: "Multi-press, chest", sets: 3, repsTarget: "6-8", fieldType: "weight", weight: 32 },
        { name: "Push-ups", sets: 3, repsTarget: "targets 12, 10, 8", fieldType: "none", note: "Bodyweight. Stop when a rep clearly slows down, not just when reps run out." },
        { name: "Cable lateral raise", sets: 2, repsTarget: "12", fieldType: "weight", weight: 5 }
      ]
    },
    Thursday: {
      label: "Thursday — leg press & heavy row",
      exercises: [
        { name: "Angled leg press", sets: 4, repsTarget: "6", fieldType: "weight", weight: 30, perSide: true },
        { name: "Barbell bent-over row", sets: 4, repsTarget: "6", fieldType: "weight", weight: 35 },
        { name: "Front squat", sets: 3, repsTarget: "6", fieldType: "weight", weight: 25, note: "Target is roughly 85% of Tuesday's front squat weight — adjust if Tuesday's weight changed." },
        { name: "Leg curl", sets: 3, repsTarget: "8-10", fieldType: "weight", weight: 36 },
        { name: "Multi-press, incline", sets: 3, repsTarget: "6-8", fieldType: "weight", weight: 27 },
        { name: "Calf raise", sets: 2, repsTarget: "12-15", fieldType: "weight", weight: 10, unit: "kg/hand" },
        { name: "Cable curl", sets: 2, repsTarget: "8-12", fieldType: "weight", weight: 15 }
      ]
    },
    Saturday: {
      label: "Saturday — hinge & vertical pull",
      exercises: [
        { name: "Rack pull, below the knee", sets: 4, repsTarget: "5", fieldType: "weight", weight: 50 },
        { name: "Angled leg press", sets: 3, repsTarget: "8-10", fieldType: "weight", weight: 32.5, perSide: true },
        { name: "Pull-up negatives", sets: 4, repsTarget: "1", fieldType: "seconds", note: "5 sec controlled lower each rep." },
        { name: "Lat pulldown", sets: 4, repsTarget: "6", fieldType: "weight", weight: 41.5 },
        { name: "Seated cable row", sets: 3, repsTarget: "8-10", fieldType: "weight", weight: 36.5 },
        { name: "Multi-press shoulder", sets: 3, repsTarget: "6-8", fieldType: "weight", weight: 27 },
        { name: "Back extension", sets: 2, repsTarget: "10-12", fieldType: "none", note: "Bodyweight. Come up until straight and stop — no arching or swinging." }
      ]
    }
  };

  var WEEKDAY_TO_SESSION = { 2: "Tuesday", 4: "Thursday", 6: "Saturday" };

  var FINISHER_NAME_ALIASES = { "Farmer's Hold": "Suitcase Hold" };

  function buildFinisherExercises(sessionKey) {
    var suitcaseSec = sessionKey === "Saturday" ? 45 : 40;
    return [
      { name: "Dead Hang", sets: 3, fieldType: "seconds-only", secTarget: 15, note: "Bodyweight. Just hang from the bar." },
      { name: "Suitcase Hold", sets: 3, fieldType: "weight-seconds", weight: 20, secTarget: suitcaseSec, note: "One-handed hold, weight per hand. Alternate hands between sets." },
      { name: "Side Plank", sets: 2, fieldType: "left-right-seconds", secTarget: 30, note: "Bodyweight. Hold each side." }
    ];
  }

  function findFinisherDef(sessionKey, name) {
    var defs = buildFinisherExercises(sessionKey);
    var resolvedName = FINISHER_NAME_ALIASES[name] || name;
    for (var i = 0; i < defs.length; i++) {
      if (defs[i].name === resolvedName) return defs[i];
    }
    return null;
  }

  function unitLabelFor(ex) {
    return ex.unit || (ex.perSide ? "kg/side" : "kg");
  }

  function isoToLabel(dateISO) {
    var d = new Date(dateISO + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  function todayISO() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { logs: {}, lastSessionChoice: {} };
      var parsed = JSON.parse(raw);
      if (!parsed.logs) parsed.logs = {};
      if (!parsed.lastSessionChoice) parsed.lastSessionChoice = {};
      return parsed;
    } catch (e) {
      return { logs: {}, lastSessionChoice: {} };
    }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  var data = loadData();
  var dateISO = todayISO();
  var weekday = new Date().getDay();
  var defaultSession = WEEKDAY_TO_SESSION[weekday] || null;
  var currentSession = data.lastSessionChoice[dateISO] || defaultSession;

  var app = document.getElementById("app");

  function logKey(dateISO, sessionKey) {
    return dateISO + "|" + sessionKey;
  }

  function blankSetFor(ex) {
    if (ex.fieldType === "weight") {
      return { done: false, weight: (ex.weight === undefined ? null : ex.weight), reps: "" };
    }
    if (ex.fieldType === "seconds") {
      return { done: false, seconds: null, reps: "" };
    }
    return { done: false, reps: "" };
  }

  function blankFinisherSetFor(ex) {
    if (ex.fieldType === "weight-seconds") {
      return { done: false, weight: (ex.weight === undefined ? null : ex.weight), seconds: null };
    }
    if (ex.fieldType === "seconds-only") {
      return { done: false, seconds: null };
    }
    if (ex.fieldType === "left-right-seconds") {
      return { done: false, leftSec: null, rightSec: null };
    }
    return { done: false };
  }

  function normalizeFinisherForLog(existingFinisher, sessionKey) {
    var defs = buildFinisherExercises(sessionKey);
    var byName = {};
    (existingFinisher || []).forEach(function (finLog) {
      byName[finLog.name] = finLog;
      var resolved = FINISHER_NAME_ALIASES[finLog.name];
      if (resolved) byName[resolved] = finLog;
    });
    return defs.map(function (def) {
      var found = byName[def.name];
      if (found) {
        found.name = def.name;
        return found;
      }
      var sets = [];
      for (var i = 0; i < def.sets; i++) sets.push(blankFinisherSetFor(def));
      return { name: def.name, sets: sets };
    });
  }

  function getLog(sessionKey) {
    var key = logKey(dateISO, sessionKey);
    if (data.logs[key]) {
      var existing = data.logs[key];
      existing.finisher = normalizeFinisherForLog(existing.finisher, sessionKey);
      return existing;
    }
    var session = SESSIONS[sessionKey];
    var exercises = session.exercises.map(function (ex) {
      var sets = [];
      for (var i = 0; i < ex.sets; i++) sets.push(blankSetFor(ex));
      return { name: ex.name, sets: sets };
    });
    return { date: dateISO, session: sessionKey, savedAt: null, exercises: exercises, finisher: normalizeFinisherForLog(null, sessionKey) };
  }

  function persistLog(sessionKey, log) {
    log.savedAt = new Date().toISOString();
    data.logs[logKey(dateISO, sessionKey)] = log;
    saveData(data);
    var savedEl = document.getElementById("saved-indicator");
    if (savedEl) {
      savedEl.textContent = "Saved at " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }
    var lastSavedEl = document.getElementById("last-saved-line");
    if (lastSavedEl) lastSavedEl.textContent = lastSavedText();
    var historyWrap = document.getElementById("history-list-wrap");
    if (historyWrap) historyWrap.innerHTML = buildHistoryCardsHtml();
  }

  function lastSavedText() {
    var keys = Object.keys(data.logs);
    if (keys.length === 0) return "Last saved: nothing saved yet";
    var newest = null;
    keys.forEach(function (k) {
      var log = data.logs[k];
      if (!newest || log.date > newest.date || (log.date === newest.date && (log.savedAt || "") > (newest.savedAt || ""))) {
        newest = log;
      }
    });
    return "Last saved: " + isoToLabel(newest.date) + " (" + newest.session + " session)";
  }

  function formatSetsCompact(exDef, exLog) {
    var parts = [];
    exLog.sets.forEach(function (setLog) {
      if (exDef.fieldType === "weight") {
        var unit = unitLabelFor(exDef);
        var w = (setLog.weight === null || setLog.weight === undefined || setLog.weight === "") ? "—" : setLog.weight + unit;
        var r = (setLog.reps === "" || setLog.reps === undefined || setLog.reps === null) ? "—" : setLog.reps;
        parts.push(w + " x" + r);
      } else if (exDef.fieldType === "seconds") {
        var s = (setLog.seconds === null || setLog.seconds === undefined || setLog.seconds === "") ? "—" : setLog.seconds + "s";
        var r2 = (setLog.reps === "" || setLog.reps === undefined || setLog.reps === null) ? "—" : setLog.reps;
        parts.push(s + " x" + r2);
      } else {
        var r3 = (setLog.reps === "" || setLog.reps === undefined || setLog.reps === null) ? "—" : setLog.reps;
        parts.push("x" + r3);
      }
    });
    return parts.join(", ");
  }

  function formatFinisherSetsCompact(exDef, exLog) {
    var parts = [];
    exLog.sets.forEach(function (setLog) {
      if (exDef.fieldType === "weight-seconds") {
        var w = (setLog.weight === null || setLog.weight === undefined || setLog.weight === "") ? "—" : setLog.weight + "kg/hand";
        var s = (setLog.seconds === null || setLog.seconds === undefined || setLog.seconds === "") ? "—" : setLog.seconds + "s";
        parts.push(w + " " + s);
      } else if (exDef.fieldType === "seconds-only") {
        var s2 = (setLog.seconds === null || setLog.seconds === undefined || setLog.seconds === "") ? "—" : setLog.seconds + "s";
        parts.push(s2);
      } else if (exDef.fieldType === "left-right-seconds") {
        var l = (setLog.leftSec === null || setLog.leftSec === undefined || setLog.leftSec === "") ? "—" : setLog.leftSec + "s";
        var r = (setLog.rightSec === null || setLog.rightSec === undefined || setLog.rightSec === "") ? "—" : setLog.rightSec + "s";
        parts.push("L" + l + "/R" + r);
      }
    });
    return parts.join(", ");
  }

  function finisherTargetText(ex) {
    if (ex.fieldType === "weight-seconds") {
      var w = (ex.weight === null || ex.weight === undefined) ? "weight not set yet" : ex.weight + " kg/hand";
      var s = ex.secTarget ? ex.secTarget + " sec" : "";
      return ex.sets + " sets — target " + w + (s ? ", " + s : "");
    }
    if (ex.fieldType === "left-right-seconds") {
      return ex.sets + " sets — target " + (ex.secTarget ? ex.secTarget + " sec each side" : "") + " (bodyweight)";
    }
    return ex.sets + " sets — target " + (ex.secTarget ? ex.secTarget + " sec" : "") + " (bodyweight)";
  }

  function buildHistoryCardsHtml() {
    var keys = Object.keys(data.logs).sort().reverse();
    if (keys.length === 0) {
      return '<div class="history-empty">No sessions saved yet.</div>';
    }
    var html = '<div class="history-list">';
    keys.forEach(function (key) {
      var log = data.logs[key];
      var sessionDef = SESSIONS[log.session];
      html += '<div class="history-card">';
      html += '<div class="history-date">' + isoToLabel(log.date) + ' — ' + log.session + '</div>';
      log.exercises.forEach(function (exLog, i) {
        var exDef = sessionDef.exercises[i];
        html += '<div class="history-ex"><b>' + exLog.name + ':</b> ' + formatSetsCompact(exDef, exLog) + '</div>';
      });
      if (log.finisher) {
        log.finisher.forEach(function (finLog) {
          var finDef = findFinisherDef(log.session, finLog.name);
          if (!finDef) return;
          html += '<div class="history-ex"><b>' + finLog.name + ':</b> ' + formatFinisherSetsCompact(finDef, finLog) + '</div>';
        });
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function buildExportText() {
    var keys = Object.keys(data.logs).sort();
    if (keys.length === 0) return "No sessions saved yet.";
    var lines = [];
    keys.forEach(function (key) {
      var log = data.logs[key];
      var sessionDef = SESSIONS[log.session];
      lines.push(isoToLabel(log.date) + " — " + log.session + " session");
      log.exercises.forEach(function (exLog, i) {
        var exDef = sessionDef.exercises[i];
        lines.push("  " + (i + 1) + ". " + exLog.name);
        exLog.sets.forEach(function (setLog, si) {
          var parts = [];
          if (exDef.fieldType === "weight") {
            var unit = unitLabelFor(exDef);
            parts.push(setLog.weight === null || setLog.weight === undefined || setLog.weight === "" ? "no weight logged" : setLog.weight + " " + unit);
          } else if (exDef.fieldType === "seconds") {
            parts.push(setLog.seconds === null || setLog.seconds === undefined || setLog.seconds === "" ? "no time logged" : setLog.seconds + " sec");
          }
          parts.push(setLog.reps === "" || setLog.reps === undefined || setLog.reps === null ? "no reps logged" : setLog.reps + " reps");
          lines.push("     Set " + (si + 1) + ": " + parts.join(", ") + (setLog.done ? " (done)" : " (not ticked)"));
        });
      });
      if (log.finisher) {
        lines.push("  Finisher:");
        log.finisher.forEach(function (finLog, i) {
          var finDef = findFinisherDef(log.session, finLog.name);
          if (!finDef) return;
          lines.push("    " + (i + 1) + ". " + finLog.name);
          finLog.sets.forEach(function (setLog, si) {
            var parts = [];
            if (finDef.fieldType === "weight-seconds") {
              parts.push(setLog.weight === null || setLog.weight === undefined || setLog.weight === "" ? "no weight logged" : setLog.weight + " kg/hand");
              parts.push(setLog.seconds === null || setLog.seconds === undefined || setLog.seconds === "" ? "no time logged" : setLog.seconds + " sec");
            } else if (finDef.fieldType === "seconds-only") {
              parts.push(setLog.seconds === null || setLog.seconds === undefined || setLog.seconds === "" ? "no time logged" : setLog.seconds + " sec");
            } else if (finDef.fieldType === "left-right-seconds") {
              parts.push(setLog.leftSec === null || setLog.leftSec === undefined || setLog.leftSec === "" ? "L: no time logged" : "L: " + setLog.leftSec + " sec");
              parts.push(setLog.rightSec === null || setLog.rightSec === undefined || setLog.rightSec === "" ? "R: no time logged" : "R: " + setLog.rightSec + " sec");
            }
            lines.push("       Set " + (si + 1) + ": " + parts.join(", ") + (setLog.done ? " (done)" : " (not ticked)"));
          });
        });
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function render() {
    var html = "";
    html += "<header><h1>Stronger You</h1>";
    html += '<div class="date-line">' + isoToLabel(dateISO) + "</div>";
    html += '<div class="last-saved-line" id="last-saved-line">' + lastSavedText() + "</div>";

    html += '<div class="switcher">';
    ["Tuesday", "Thursday", "Saturday"].forEach(function (key) {
      var active = key === currentSession ? " active" : "";
      html += '<button type="button" class="switch-btn' + active + '" data-session="' + key + '">' + key + "</button>";
    });
    html += "</div></header>";

    var log = null;
    var session = null;

    if (!currentSession) {
      html += '<div class="chooser-hint">Today isn\'t a scheduled session day. Pick which session to log above.</div>';
    } else {
      session = SESSIONS[currentSession];
      log = getLog(currentSession);

      html += '<div class="saved" id="saved-indicator">' + (log.savedAt ? "Saved at " + new Date(log.savedAt).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "Not saved yet") + "</div>";

      session.exercises.forEach(function (ex, exIdx) {
        html += '<div class="exercise">';
        html += '<div class="ex-name">' + (exIdx + 1) + ". " + ex.name + "</div>";

        var targetText = ex.sets + " sets";
        if (ex.name === "Push-ups") {
          targetText += ", " + ex.repsTarget;
        } else {
          targetText += " x " + ex.repsTarget + " reps";
          if (ex.fieldType === "weight") {
            var unit = unitLabelFor(ex);
            targetText += (ex.weight === null || ex.weight === undefined) ? " — weight not set yet" : " — target " + ex.weight + " " + unit;
          } else {
            targetText += " — bodyweight";
          }
        }
        html += '<div class="ex-target">' + targetText + "</div>";
        if (ex.note) html += '<div class="ex-note">' + ex.note + "</div>";

        var typeClass = ex.fieldType === "none" ? " type-none" : "";
        if (ex.fieldType === "weight") {
          html += '<div class="col-headers' + typeClass + '"><span>Set</span><span></span><span>Weight</span><span></span><span>Reps done</span></div>';
        } else if (ex.fieldType === "seconds") {
          html += '<div class="col-headers' + typeClass + '"><span>Set</span><span></span><span>Sec</span><span></span><span>Reps done</span></div>';
        } else {
          html += '<div class="col-headers' + typeClass + '"><span>Set</span><span></span><span>Reps done</span></div>';
        }

        var exLog = log.exercises[exIdx];
        for (var i = 0; i < ex.sets; i++) {
          var setLog = exLog.sets[i];
          html += '<div class="set-row' + typeClass + '">';
          html += '<span class="set-label">Set ' + (i + 1) + "</span>";
          html += '<input type="checkbox" class="chk" data-ex="' + exIdx + '" data-set="' + i + '"' + (setLog.done ? " checked" : "") + ">";

          if (ex.fieldType === "weight") {
            var weightVal = setLog.weight === null || setLog.weight === undefined ? "" : setLog.weight;
            var unit = unitLabelFor(ex);
            html += '<input type="number" step="0.5" min="0" inputmode="decimal" class="wt" placeholder="kg" data-ex="' + exIdx + '" data-set="' + i + '" value="' + weightVal + '">';
            html += '<span class="unit-label">' + unit + "</span>";
          } else if (ex.fieldType === "seconds") {
            var secVal = setLog.seconds === null || setLog.seconds === undefined ? "" : setLog.seconds;
            html += '<input type="number" step="1" min="0" inputmode="numeric" class="sec" placeholder="sec" data-ex="' + exIdx + '" data-set="' + i + '" value="' + secVal + '">';
            html += '<span class="unit-label">sec</span>';
          }

          html += '<input type="number" step="1" min="0" inputmode="numeric" class="reps" placeholder="reps" data-ex="' + exIdx + '" data-set="' + i + '" value="' + (setLog.reps === undefined ? "" : setLog.reps) + '">';
          html += "</div>";
        }
        html += "</div>";
      });

      html += '<div class="finisher-section">';
      html += '<div class="finisher-title">Finisher</div>';
      buildFinisherExercises(currentSession).forEach(function (ex, exIdx) {
        html += '<div class="exercise">';
        html += '<div class="ex-name">' + ex.name + "</div>";
        html += '<div class="ex-target">' + finisherTargetText(ex) + "</div>";
        if (ex.note) html += '<div class="ex-note">' + ex.note + "</div>";

        var cols3 = ex.fieldType === "seconds-only";
        var finTypeClass = cols3 ? " type-none" : "";

        if (ex.fieldType === "weight-seconds") {
          html += '<div class="col-headers' + finTypeClass + '"><span>Set</span><span></span><span>Weight</span><span></span><span>Sec</span></div>';
        } else if (ex.fieldType === "seconds-only") {
          html += '<div class="col-headers' + finTypeClass + '"><span>Set</span><span></span><span>Sec</span></div>';
        } else if (ex.fieldType === "left-right-seconds") {
          html += '<div class="col-headers' + finTypeClass + '"><span>Set</span><span></span><span>Left sec</span><span></span><span>Right sec</span></div>';
        }

        var finLog = log.finisher[exIdx];
        for (var fi = 0; fi < ex.sets; fi++) {
          var finSetLog = finLog.sets[fi];
          html += '<div class="set-row' + finTypeClass + '">';
          html += '<span class="set-label">Set ' + (fi + 1) + "</span>";
          html += '<input type="checkbox" class="fin-chk" data-ex="' + exIdx + '" data-set="' + fi + '"' + (finSetLog.done ? " checked" : "") + ">";

          if (ex.fieldType === "weight-seconds") {
            var finWv = finSetLog.weight === null || finSetLog.weight === undefined ? "" : finSetLog.weight;
            var finSv = finSetLog.seconds === null || finSetLog.seconds === undefined ? "" : finSetLog.seconds;
            html += '<input type="number" step="0.5" min="0" inputmode="decimal" class="fin-wt" placeholder="kg" data-ex="' + exIdx + '" data-set="' + fi + '" value="' + finWv + '">';
            html += '<span class="unit-label">kg/hand</span>';
            html += '<input type="number" step="1" min="0" inputmode="numeric" class="fin-sec" placeholder="sec" data-ex="' + exIdx + '" data-set="' + fi + '" value="' + finSv + '">';
          } else if (ex.fieldType === "seconds-only") {
            var finSv2 = finSetLog.seconds === null || finSetLog.seconds === undefined ? "" : finSetLog.seconds;
            html += '<input type="number" step="1" min="0" inputmode="numeric" class="fin-sec" placeholder="sec" data-ex="' + exIdx + '" data-set="' + fi + '" value="' + finSv2 + '">';
          } else if (ex.fieldType === "left-right-seconds") {
            var finLv = finSetLog.leftSec === null || finSetLog.leftSec === undefined ? "" : finSetLog.leftSec;
            var finRv = finSetLog.rightSec === null || finSetLog.rightSec === undefined ? "" : finSetLog.rightSec;
            html += '<input type="number" step="1" min="0" inputmode="numeric" class="fin-left" placeholder="sec" data-ex="' + exIdx + '" data-set="' + fi + '" value="' + finLv + '">';
            html += '<span class="unit-label">sec</span>';
            html += '<input type="number" step="1" min="0" inputmode="numeric" class="fin-right" placeholder="sec" data-ex="' + exIdx + '" data-set="' + fi + '" value="' + finRv + '">';
          }
          html += "</div>";
        }
        html += "</div>";
      });
      html += "</div>";
    }

    html += '<div class="history-section">';
    html += '<div class="history-title">History</div>';
    html += '<div id="history-list-wrap">' + buildHistoryCardsHtml() + '</div>';
    html += '</div>';

    html += '<div class="export-section">';
    html += '<div class="export-buttons"><button type="button" id="export-btn">Export session history</button><button type="button" id="copy-btn">Copy</button></div>';
    html += '<textarea id="export-text" readonly rows="10" placeholder="Tap &ldquo;Export session history&rdquo; to build a text summary of every saved session, ready to copy and paste."></textarea>';
    html += '<div class="copy-status" id="copy-status"></div>';
    html += "</div>";

    html += '<div class="danger-section">';
    html += '<button type="button" id="clear-history-btn" class="danger-btn">Clear History</button>';
    html += '<div class="danger-status" id="danger-status"></div>';
    html += "</div>";

    app.innerHTML = html;
    attachSwitcherHandlers();
    if (session && log) {
      attachInputHandlers(session, log);
      attachFinisherHandlers(log);
    }
    attachExportHandlers();
    attachDangerHandlers();
  }

  function attachSwitcherHandlers() {
    var btns = document.querySelectorAll(".switch-btn");
    btns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentSession = btn.getAttribute("data-session");
        data.lastSessionChoice[dateISO] = currentSession;
        saveData(data);
        render();
      });
    });
  }

  function attachInputHandlers(session, log) {
    function updateFromInput(el) {
      var exIdx = parseInt(el.getAttribute("data-ex"), 10);
      var setIdx = parseInt(el.getAttribute("data-set"), 10);
      var setLog = log.exercises[exIdx].sets[setIdx];
      if (el.classList.contains("chk")) {
        setLog.done = el.checked;
      } else if (el.classList.contains("wt")) {
        setLog.weight = el.value === "" ? null : parseFloat(el.value);
      } else if (el.classList.contains("sec")) {
        setLog.seconds = el.value === "" ? null : parseFloat(el.value);
      } else if (el.classList.contains("reps")) {
        setLog.reps = el.value === "" ? "" : parseInt(el.value, 10);
      }
      persistLog(currentSession, log);
    }

    app.querySelectorAll(".chk").forEach(function (el) {
      el.addEventListener("change", function () { updateFromInput(el); });
    });
    app.querySelectorAll(".wt, .sec, .reps").forEach(function (el) {
      el.addEventListener("input", function () { updateFromInput(el); });
      el.addEventListener("blur", function () { updateFromInput(el); });
    });
  }

  function attachFinisherHandlers(log) {
    function updateFromFinisherInput(el) {
      var exIdx = parseInt(el.getAttribute("data-ex"), 10);
      var setIdx = parseInt(el.getAttribute("data-set"), 10);
      var setLog = log.finisher[exIdx].sets[setIdx];
      if (el.classList.contains("fin-chk")) {
        setLog.done = el.checked;
      } else if (el.classList.contains("fin-wt")) {
        setLog.weight = el.value === "" ? null : parseFloat(el.value);
      } else if (el.classList.contains("fin-sec")) {
        setLog.seconds = el.value === "" ? null : parseFloat(el.value);
      } else if (el.classList.contains("fin-left")) {
        setLog.leftSec = el.value === "" ? null : parseFloat(el.value);
      } else if (el.classList.contains("fin-right")) {
        setLog.rightSec = el.value === "" ? null : parseFloat(el.value);
      }
      persistLog(currentSession, log);
    }

    app.querySelectorAll(".fin-chk").forEach(function (el) {
      el.addEventListener("change", function () { updateFromFinisherInput(el); });
    });
    app.querySelectorAll(".fin-wt, .fin-sec, .fin-left, .fin-right").forEach(function (el) {
      el.addEventListener("input", function () { updateFromFinisherInput(el); });
      el.addEventListener("blur", function () { updateFromFinisherInput(el); });
    });
  }

  function attachDangerHandlers() {
    var btn = document.getElementById("clear-history-btn");
    var status = document.getElementById("danger-status");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var count = Object.keys(data.logs).length;
      if (count === 0) {
        if (status) status.textContent = "There's no saved history to clear.";
        return;
      }
      var ok = window.confirm("This will permanently delete " + count + " saved session" + (count === 1 ? "" : "s") + ". This can't be undone. Continue?");
      if (!ok) return;
      data.logs = {};
      saveData(data);
      render();
    });
  }

  function attachExportHandlers() {
    var exportBtn = document.getElementById("export-btn");
    var copyBtn = document.getElementById("copy-btn");
    var textarea = document.getElementById("export-text");
    var status = document.getElementById("copy-status");

    function showStatus(msg) {
      if (!status) return;
      status.textContent = msg;
      setTimeout(function () { if (status) status.textContent = ""; }, 2500);
    }

    if (exportBtn) {
      exportBtn.addEventListener("click", function () {
        textarea.value = buildExportText();
        textarea.focus();
        textarea.select();
      });
    }

    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        if (!textarea.value) textarea.value = buildExportText();
        textarea.focus();
        textarea.select();
        var done = function () { showStatus("Copied to clipboard"); };
        var fail = function () {
          try {
            document.execCommand("copy");
            showStatus("Copied to clipboard");
          } catch (e) {
            showStatus("Couldn't copy automatically — text is selected, use your keyboard's copy.");
          }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textarea.value).then(done).catch(fail);
        } else {
          fail();
        }
      });
    }
  }

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
